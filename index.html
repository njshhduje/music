<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media App 完全版</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

/* ハンバーガー */
.menu-btn {
    position: fixed; top:15px; left:15px; width:30px; cursor:pointer;
}
.menu-btn span {
    display:block; height:4px; background:#333; margin:5px 0;
}

/* サイドバー */
.sidebar {
    position: fixed; top:0; left:-260px;
    width:260px; height:100%;
    background:#111; color:white;
    transition:.3s; padding-top:80px;
}
.sidebar.active { left:0; }
.menu-item { padding:18px; border-bottom:1px solid #333; cursor:pointer; }

/* コンテンツ */
.content { padding:80px 20px; }
.section { display:none; }
.section.active { display:block; }

/* カード */
.media-box {
    max-width:600px; margin:20px auto;
    background:white; padding:15px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.media-box h3 { margin-bottom:10px; }

iframe { width:100%; height:315px; }
video { width:100%; }
audio { width:100%; }

/* 入力 */
.input-area {
    max-width:600px; margin:10px auto;
    display:flex; gap:10px; flex-wrap:wrap;
}
input[type="text"] { flex:1; padding:10px; }
button { padding:8px; cursor:pointer; }

/* 操作 */
.actions {
    margin-top:10px;
    display:flex;
    gap:10px;
}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="sidebar" id="sidebar">
    <div class="menu-item" onclick="showSection('video')">動画</div>
    <div class="menu-item" onclick="showSection('audio')">音声</div>
</div>

<div class="content">

<!-- 動画 -->
<div id="video" class="section active">
    <div class="input-area">
        <input id="videoTitle" placeholder="タイトル">
        <input id="videoUrl" placeholder="YouTube URL">
        <input type="file" id="videoFile" accept="video/*">
        <button onclick="addVideo()">追加</button>
    </div>
    <div id="videoList"></div>
</div>

<!-- 音声 -->
<div id="audio" class="section">
    <div class="input-area">
        <input id="audioTitle" placeholder="タイトル">
        <input type="file" id="audioFile" accept="audio/*">
        <button onclick="addAudio()">追加</button>
    </div>
    <div id="audioList"></div>
</div>

</div>

<script>
/* =======================
   IndexedDB
======================= */
let db;
const request = indexedDB.open("MediaAppDB", 1);

request.onupgradeneeded = e => {
    db = e.target.result;
    db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
    db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
};

request.onsuccess = e => {
    db = e.target.result;
    render();
};

/* =======================
   UI
======================= */
function toggleMenu() {
    sidebar.classList.toggle("active");
}
function showSection(type) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(type).classList.add("active");
    sidebar.classList.remove("active");
}

/* =======================
   追加
======================= */
function addVideo() {
    const title = videoTitle.value || "無題";
    const url = videoUrl.value;
    const file = videoFile.files[0];

    if (!url && !file) return alert("URLかファイルを入力して");

    const tx = db.transaction("videos", "readwrite");
    tx.objectStore("videos").add({ title, url, file });
    tx.oncomplete = render;
}

function addAudio() {
    const title = audioTitle.value || "無題";
    const file = audioFile.files[0];
    if (!file) return alert("ファイル選択して");

    const tx = db.transaction("audios", "readwrite");
    tx.objectStore("audios").add({ title, file });
    tx.oncomplete = render;
}

/* =======================
   削除・編集
======================= */
function deleteItem(type, id) {
    db.transaction(type, "readwrite").objectStore(type).delete(id).oncomplete = render;
}

function editItem(type, data) {
    const newTitle = prompt("タイトル変更", data.title);
    if (newTitle !== null) data.title = newTitle;

    if (type === "videos") {
        const newUrl = prompt("URL変更", data.url || "");
        if (newUrl !== null) data.url = newUrl;
    }

    db.transaction(type, "readwrite").objectStore(type).put(data).oncomplete = render;
}

/* =======================
   描画
======================= */
function render() {
    renderVideos();
    renderAudios();
}

function renderVideos() {
    videoList.innerHTML = "";

    db.transaction("videos").objectStore("videos").openCursor().onsuccess = e => {
        const c = e.target.result;
        if (!c) return;

        const v = c.value;
        const box = createBox(v.title, "videos", v);

        // YouTube
        if (v.url) {
            const id = extractYouTubeID(v.url);
            if (id) {
                const iframe = document.createElement("iframe");
                iframe.src = `https://www.youtube.com/embed/${id}`;
                box.insertBefore(iframe, box.querySelector(".actions"));
            }
        }

        // ローカル動画
        if (v.file) {
            const video = document.createElement("video");
            video.controls = true;
            video.src = URL.createObjectURL(v.file);
            box.insertBefore(video, box.querySelector(".actions"));
        }

        videoList.appendChild(box);
        c.continue();
    };
}

function renderAudios() {
    audioList.innerHTML = "";

    db.transaction("audios").objectStore("audios").openCursor().onsuccess = e => {
        const c = e.target.result;
        if (!c) return;

        const a = c.value;
        const box = createBox(a.title, "audios", a);

        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = URL.createObjectURL(a.file);

        box.insertBefore(audio, box.querySelector(".actions"));
        audioList.appendChild(box);

        c.continue();
    };
}

/* =======================
   共通UI
======================= */
function createBox(title, type, data) {
    const box = document.createElement("div");
    box.className = "media-box";

    const h3 = document.createElement("h3");
    h3.textContent = title;

    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.textContent = "編集";
    editBtn.onclick = () => editItem(type, data);

    const delBtn = document.createElement("button");
    delBtn.textContent = "削除";
    delBtn.onclick = () => deleteItem(type, data.id);

    actions.append(editBtn, delBtn);
    box.append(h3, actions);

    return box;
}

/* =======================
   YouTube対応（完全版）
======================= */
function extractYouTubeID(url) {
    const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/shorts\/)([^&?/]+)/;
    const m = url.match(reg);
    return m ? m[1] : null;
}
</script>

</body>
</html>
