<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI",sans-serif;
    background:#eef2f7;
}

/* ハンバーガー */
.menu-btn{
    position:fixed;
    top:15px;
    left:15px;
    width:34px;
    z-index:1000;
    cursor:pointer;
}

.menu-btn span{
    display:block;
    height:4px;
    margin:6px 0;
    border-radius:3px;
    background:#222;
}

/* サイドバー */
.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:260px;
    height:100%;
    background:#1f2937;
    color:white;
    transition:.3s;
    padding-top:80px;
    z-index:999;
    box-shadow:4px 0 20px rgba(0,0,0,.2);
}

.sidebar.active{
    left:0;
}

.menu-item{
    padding:18px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.menu-item:hover{
    background:#374151;
}

/* コンテンツ */
.content{
    padding:70px 15px;
}

/* セクション */
.section{
    display:none;
}

.section.active{
    display:block;
}

/* 入力欄 */
.input-area{
    max-width:900px;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.input-area input[type="text"]{
    flex:1;
    min-width:180px;
}

input{
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

/* ボタン */
button{
    border:none;
    padding:10px 16px;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

/* カード */
.media-box{
    max-width:900px;
    margin:18px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.media-box h3{
    margin:0;
    padding:15px;
    background:#f8fafc;
    border-bottom:1px solid #eee;
}

/* メディア */
iframe{
    width:100%;
    height:420px;
    border:none;
}

video{
    width:100%;
    display:block;
}

audio{
    width:calc(100% - 30px);
    margin:15px;
}

/* 操作ボタン */
.actions{
    display:flex;
    gap:10px;
    padding:15px;
}

.actions button:nth-child(2){
    background:#dc2626;
}

@media(max-width:700px){

    iframe{
        height:220px;
    }

    .input-area{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>

<div class="sidebar" id="sidebar">
    <div class="menu-item" onclick="showSection('video')">動画</div>
    <div class="menu-item" onclick="showSection('audio')">音声</div>
</div>

<div class="content">

<!-- 動画 -->
<div id="video" class="section active">
    <div class="input-area">
        <input id="videoTitle" placeholder="タイトル">
        <input id="videoUrl" placeholder="YouTube URL">
        <input type="file" id="videoFile" accept="video/*">
        <button onclick="addVideo()">追加</button>
    </div>
    <div id="videoList"></div>
</div>

<!-- 音声 -->
<div id="audio" class="section">
    <div class="input-area">
        <input id="audioTitle" placeholder="タイトル">
        <input type="file" id="audioFile" accept="audio/*">
        <button onclick="addAudio()">追加</button>
    </div>
    <div id="audioList"></div>
</div>

</div>

<script>
/* =======================
   IndexedDB
======================= */
let db;
const request = indexedDB.open("MediaAppDB", 1);

request.onupgradeneeded = e => {
    db = e.target.result;
    db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
    db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
};

request.onsuccess = e => {
    db = e.target.result;
    render();
};

/* =======================
   UI
======================= */
function toggleMenu() {
    sidebar.classList.toggle("active");
}
function showSection(type) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(type).classList.add("active");
    sidebar.classList.remove("active");
}

/* =======================
   追加
======================= */
function addVideo(){

    const title = videoTitle.value || "無題";
    const url = videoUrl.value;
    const file = videoFile.files[0];

    if(!url && !file){
        alert("URLかファイルを入力してください");
        return;
    }

    const tx = db.transaction("videos","readwrite");

    const req = tx.objectStore("videos").add({
        title,
        url,
        file
    });

    req.onsuccess = e => {

        appendVideo({
            id:e.target.result,
            title,
            url,
            file
        });

        videoTitle.value="";
        videoUrl.value="";
        videoFile.value="";
    };
}

function addAudio(){

    const title = audioTitle.value || "無題";
    const file = audioFile.files[0];

    if(!file){
        alert("音声ファイルを選択してください");
        return;
    }

    const tx = db.transaction("audios","readwrite");

    const req = tx.objectStore("audios").add({
        title,
        file
    });

    req.onsuccess = e => {

        appendAudio({
            id:e.target.result,
            title,
            file
        });

        audioTitle.value="";
        audioFile.value="";
    };
}

function appendVideo(v){

    const box = createBox(v.title,"videos",v);

    if(v.url){

        const id = extractYouTubeID(v.url);

        if(id){

            const iframe = document.createElement("iframe");

            iframe.src =
                `https://www.youtube.com/embed/${id}`;

            box.insertBefore(
                iframe,
                box.querySelector(".actions")
            );
        }
    }

    if(v.file){

        const video = document.createElement("video");

        video.controls = true;

        video.src =
            URL.createObjectURL(v.file);

        box.insertBefore(
            video,
            box.querySelector(".actions")
        );
    }

    videoList.appendChild(box);
}

function appendAudio(a){

    const box = createBox(a.title,"audios",a);

    const audio =
        document.createElement("audio");

    audio.controls = true;

    audio.src =
        URL.createObjectURL(a.file);

    box.insertBefore(
        audio,
        box.querySelector(".actions")
    );

    audioList.appendChild(box);
}

/* =======================
   削除・編集
======================= */
function deleteItem(type, id) {
    db.transaction(type, "readwrite").objectStore(type).delete(id).oncomplete = render;
}

function editItem(type, data) {
    const newTitle = prompt("タイトル変更", data.title);
    if (newTitle !== null) data.title = newTitle;

    if (type === "videos") {
        const newUrl = prompt("URL変更", data.url || "");
        if (newUrl !== null) data.url = newUrl;
    }

    db.transaction(type, "readwrite").objectStore(type).put(data).oncomplete = render;
}

/* =======================
   描画
======================= */
function render() {
    renderVideos();
    renderAudios();
}

function renderVideos(){

    videoList.innerHTML = "";

    db.transaction("videos")
      .objectStore("videos")
      .openCursor()
      .onsuccess = e => {

        const c = e.target.result;

        if(!c) return;

        appendVideo(c.value);

        c.continue();
    };
}

        // ローカル動画
        if (v.file) {
            const video = document.createElement("video");
            video.controls = true;
            video.src = URL.createObjectURL(v.file);
            box.insertBefore(video, box.querySelector(".actions"));
        }

        videoList.appendChild(box);
        c.continue();
    };
}

function renderAudios(){

    audioList.innerHTML = "";

    db.transaction("audios")
      .objectStore("audios")
      .openCursor()
      .onsuccess = e => {

        const c = e.target.result;

        if(!c) return;

        appendAudio(c.value);

        c.continue();
    };
}

/* =======================
   共通UI
======================= */
function createBox(title, type, data) {
    const box = document.createElement("div");
    box.className = "media-box";

    const h3 = document.createElement("h3");
    h3.textContent = title;

    const actions = document.createElement("div");
    actions.className = "actions";

    const editBtn = document.createElement("button");
    editBtn.textContent = "編集";
    editBtn.onclick = () => editItem(type, data);

    const delBtn = document.createElement("button");
    delBtn.textContent = "削除";
    delBtn.onclick = () => deleteItem(type, data.id);

    actions.append(editBtn, delBtn);
    box.append(h3, actions);

    return box;
}

/* =======================
   YouTube対応（完全版）
======================= */
function extractYouTubeID(url) {
    const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/shorts\/)([^&?/]+)/;
    const m = url.match(reg);
    return m ? m[1] : null;
}
</script>

</body>
</html>
